name: CI

# Every quality gate in docs/spec/playbook.md, on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  check:
    name: Types, lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm check
        run: pnpm check
      - name: Generated files are current
        run: |
          pnpm --filter @stash/contracts gen
          pnpm --filter @stash/ui gen
          node scripts/sync-limits.mjs --check
          # Catches edits and new untracked files alike.
          test -z "$(git status --porcelain -- packages/contracts/generated packages/ui/src/theme.css supabase/migrations)" \
            || { git status --porcelain; git diff; exit 1; }
      - name: Local storage for the signed-URL tests (SeaweedFS, as in pnpm dev)
        run: |
          docker compose up -d --wait storage
          docker compose run --rm storage-init
          grep -E '^STASH_(S3|BUCKET)_' .env.example >> "$GITHUB_ENV"
      - name: pnpm test
        run: pnpm test
        env:
          STASH_REQUIRE_STORAGE: "1"
      - name: Storage logs on failure
        if: failure()
        run: docker compose logs storage storage-init || true
      - name: Changed audio and contracts code has tests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/require-tests.mjs

  db:
    name: Database policies
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm db:test
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm db:test

  worker:
    name: Worker
    runs-on: ubuntu-24.04
    # The runner's tests drive the real SQL worker functions (request 111-worker-ci-postgres).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      STASH_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
      - name: pnpm worker:test
        run: pnpm worker:test
      # Isolation tests start the job child as another uid, which needs root. As root with
      # STASH_REQUIRE_ISOLATION=1 they fail instead of skipping (request 112-worker-isolation-ci).
      - name: Worker isolation tests (as root)
        working-directory: apps/worker
        # The job user (nobody) must reach the venv's interpreter and the checkout: open search
        # permission on each folder above it (the runner's home is 0750).
        run: |
          d="$PWD"; while [ "$d" != / ]; do sudo chmod o+x "$d"; d="$(dirname "$d")"; done
          sudo --preserve-env=DATABASE_ADMIN_URL,STASH_REQUIRE_DB env STASH_REQUIRE_ISOLATION=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: Lint and format
        working-directory: apps/worker
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .

  browser:
    name: End-to-end, visual, accessibility and performance
    runs-on: ubuntu-24.04
    # Runs on the host so the Supabase stack (Docker) and Mailpit can serve the sign-up journeys
    # (request 133-e2e-supabase). Screenshots still come from the pinned Playwright container:
    # scripts/visual.mjs runs it with --network host, so baselines render identically everywhere.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_PREVIEWS_BASE_URL: https://media.stash.local
      STASH_MAILPIT_URL: http://127.0.0.1:54324
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (migrations and seed) and Mailpit
        run: |
          # Only what the app and the journeys use (db, auth, rest, kong, mailpit): fewer image pulls
          # from public.ecr.aws, which rate-limits unauthenticated runners. Retried, since a limit
          # is per minute.
          for i in 1 2 3; do
            npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor && break
            npx supabase stop --no-backup || true
            [ "$i" = 3 ] && exit 1
            sleep 60
          done
          npx supabase status -o env | sed -n 's/^API_URL="\(.*\)"$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^ANON_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_ANON_KEY=\1/p; s/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SERVICE_ROLE_KEY=\1/p' >> "$GITHUB_ENV"
      - name: Install the Playwright browser for e2e and perf on the host
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and start the web app once for all three gates
        run: |
          pnpm --filter @stash/web build
          (STASH_DEV_PAGES=1 pnpm --filter @stash/web exec next start --port 3100 &)
          npx --yes wait-on@8 http://localhost:3100/api/health
      - name: pnpm e2e (includes the accessibility scan)
        env: { STASH_BASE_URL: "http://localhost:3100" }
        run: pnpm e2e
      - name: pnpm visual (pinned container, host network)
        env: { STASH_BASE_URL: "http://localhost:3100" }
        run: pnpm visual
      - name: pnpm perf
        env: { STASH_BASE_URL: "http://localhost:3100" }
        run: pnpm perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  local-stack:
    name: One-command local stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: pnpm dev starts Supabase (migrations and seed), storage, the worker and the web app
        run: pnpm dev --check
      - name: The production worker image builds
        run: docker compose --profile worker build worker
      - name: Logs on failure
        if: failure()
        run: docker compose logs storage storage-init || true

  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: pnpm run licenses
        run: pnpm run licenses
