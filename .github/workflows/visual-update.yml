# Regenerates screenshot baselines in the pinned Playwright container, for lanes without Docker.
# Push the branch whose baselines need updating to `visual-update/<anything>`; this job runs
# `pnpm visual:update` there and commits the changed PNGs back to that same visual-update branch
# (never to a lane branch). The builder fetches it, reviews each image, and commits them on the
# real branch, so every baseline change is still a reviewed commit. A push made with GITHUB_TOKEN
# does not start another run.
name: Visual baselines
on:
  push:
    branches: ["visual-update/**"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      STASH_PLAYWRIGHT_CONTAINER: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start the web app
        run: |
          pnpm --filter @stash/web build
          (STASH_DEV_PAGES=1 pnpm --filter @stash/web exec next start --port 3100 &)
          npx --yes wait-on@8 http://localhost:3100/api/health
      - name: pnpm visual:update
        env: { STASH_BASE_URL: "http://localhost:3100" }
        run: pnpm visual:update
      - name: Commit changed baselines to this visual-update branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.png'
          git diff --cached --stat
          if git diff --cached --quiet; then echo "No baseline changed."; exit 0; fi
          git commit -m "Visual baselines regenerated in the pinned container"
          git push origin "HEAD:${GITHUB_REF_NAME}"
