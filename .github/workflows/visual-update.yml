# Regenerates screenshot baselines in the pinned Playwright container, for lanes without Docker.
# Push the branch whose baselines need updating to `visual-update/<anything>`; this job runs
# `pnpm visual:update` there and commits the changed PNGs back to that same visual-update branch
# (never to a lane branch). The builder fetches it, reviews each image, and commits them on the
# real branch, so every baseline change is still a reviewed commit. A push made with GITHUB_TOKEN
# does not start another run.
name: Visual baselines
on:
  push:
    branches: ["visual-update/**"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    # Host runner: Supabase for the app, screenshots in the pinned container via scripts/visual.mjs.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_PREVIEWS_BASE_URL: https://media.stash.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: |
          # Only what the app and the journeys use (db, auth, rest, kong, mailpit): fewer image pulls
          # from public.ecr.aws, which rate-limits unauthenticated runners. Retried, since a limit
          # is per minute.
          for i in 1 2 3; do
            npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor && break
            npx supabase stop --no-backup || true
            [ "$i" = 3 ] && exit 1
            sleep 60
          done
          npx supabase status -o env | sed -n 's/^API_URL="\(.*\)"$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^ANON_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_ANON_KEY=\1/p; s/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SERVICE_ROLE_KEY=\1/p' >> "$GITHUB_ENV"
      - name: Build and start the web app
        run: |
          pnpm --filter @stash/web build
          (STASH_DEV_PAGES=1 pnpm --filter @stash/web exec next start --port 3100 &)
          npx --yes wait-on@8 http://localhost:3100/api/health
      - name: pnpm visual:update
        env: { STASH_BASE_URL: "http://localhost:3100" }
        run: pnpm visual:update
      - name: Commit changed baselines to this visual-update branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.png'
          git diff --cached --stat
          if git diff --cached --quiet; then echo "No baseline changed."; exit 0; fi
          git commit -m "Visual baselines regenerated in the pinned container"
          git push origin "HEAD:${GITHUB_REF_NAME}"
