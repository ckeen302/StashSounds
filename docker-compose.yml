# Local S3-compatible storage standing in for Cloudflare R2. Started by `pnpm dev`.
# Supabase (database, auth, realtime) runs through the Supabase CLI, not this file.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-52Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stash
      MINIO_ROOT_PASSWORD: stash-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates the two buckets: originals is private, previews is public-read.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 stash stash-local-only &&
      mc mb --ignore-existing local/originals &&
      mc mb --ignore-existing local/previews &&
      mc anonymous set download local/previews &&
      echo buckets ready"

  # The worker image for production-like runs: `docker compose --profile worker up`.
  # `pnpm dev` runs the worker straight from apps/worker with uv instead, for fast reloads.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env.local
    environment:
      STASH_S3_ENDPOINT: http://minio:9000
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
