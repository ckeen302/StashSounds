<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio engine test page</title>
    <!-- The engine imports these (the stretch lazily); in the app the bundler resolves them, here the server serves them. -->
    <script type="importmap">
      { "imports": { "signalsmith-stretch": "/vendor/signalsmith-stretch.mjs", "@stash/contracts/limits.json": "/vendor/limits.json" } }
    </script>
  </head>
  <body>
    <!-- Bare test page for packages/audio (ticket 121). Not product UI: no tokens, no components. -->
    <h1>Audio engine test page</h1>
    <p>
      <label>Fixture loop <select id="fixture"></select></label>
    </p>
    <p>
      <button id="play" type="button">Play</button>
      <button id="pause" type="button">Pause</button>
      <button id="retry" type="button">Play (no argument: resume or retry)</button>
    </p>
    <p>
      <label>Position <input id="seek" type="range" min="0" max="1000" value="0" /></label>
      <output id="position">0 ms</output>
    </p>
    <p>
      <label>Tempo (BPM) <input id="tempo" type="number" min="40" max="300" step="1" /></label>
      <label>Transpose (semitones) <input id="transpose" type="number" min="-12" max="12" step="1" value="0" /></label>
    </p>
    <p>
      <label>Volume <input id="volume" type="range" min="0" max="100" value="80" /></label>
    </p>
    <pre id="state"></pre>
    <script type="module" src="/test-page/main.ts"></script>
  </body>
</html>
